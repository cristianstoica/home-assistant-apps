{# Plan §10: shown whenever the weather.com key is refused for the wind lane. #}
{% if wind_banner %}
  <p class="notice" id="wind-banner">
    {% for title in wind_banner.holds %}
      <strong>{{ title }}.</strong>
    {% endfor %}
    {% if wind_banner.holds %}Use "Try again" in the Wind History panel on Ops to check the key again.{% endif %}
  </p>
{% endif %}
